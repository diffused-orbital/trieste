<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="760" height="420" fill="#ffffff"/>
<text x="78" y="26" font-size="16" font-weight="600" fill="#1f2328">Exact prefix Top-K latency vs prefix length</text>
<text x="78" y="44" font-size="11.5" fill="#6e7781">k=5, edit budget 0. Short prefixes sit above huge subtrees and M1 walks all of them; the 2ms/5ms budget is drawn for reference.</text>
