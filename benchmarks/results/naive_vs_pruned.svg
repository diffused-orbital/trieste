<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="760" height="430" fill="#ffffff"/>
<text x="78" y="26" font-size="16" font-weight="600" fill="#1f2328">Fuzzy search: naive full-dictionary vs trie-pruned</text>
<text x="78" y="47" font-size="11.5" fill="#6e7781">p50 per query, 108,008-term corpus, log scale</text>
<rect x="78.0" y="64" width="11" height="11" fill="#0969da" rx="2"/>
<text x="95.0" y="74" font-size="11.5" fill="#1f2328">Naive O(N*M) scan</text>
<rect x="225.6" y="64" width="11" height="11" fill="#cf222e" rx="2"/>
<text x="242.6" y="74" font-size="11.5" fill="#1f2328">Trie + pruned DP walk</text>
<line x1="78" y1="368.0" x2="734" y2="368.0" stroke="#d8dee4"/>
<text x="70" y="372.0" font-size="11" fill="#6e7781" text-anchor="end">10 us</text>
<line x1="78" y1="285.6" x2="734" y2="285.6" stroke="#d8dee4"/>
<text x="70" y="289.6" font-size="11" fill="#6e7781" text-anchor="end">100 us</text>
<line x1="78" y1="203.2" x2="734" y2="203.2" stroke="#d8dee4"/>
<text x="70" y="207.2" font-size="11" fill="#6e7781" text-anchor="end">1 ms</text>
<line x1="78" y1="120.8" x2="734" y2="120.8" stroke="#d8dee4"/>
<text x="70" y="124.8" font-size="11" fill="#6e7781" text-anchor="end">10 ms</text>
<rect x="158.0" y="123.5" width="74" height="244.5" fill="#0969da" rx="3"/>
<text x="195.0" y="116.5" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">9.28 ms</text>
<rect x="252.0" y="320.4" width="74" height="47.6" fill="#cf222e" rx="3"/>
<text x="289.0" y="313.4" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">37.8 us</text>
<text x="242.0" y="390.0" font-size="12.5" fill="#1f2328" text-anchor="middle">E = 1</text>
<text x="242.0" y="409.0" font-size="13" font-weight="700" fill="#1a7f37" text-anchor="middle">245x faster</text>
<rect x="486.0" y="122.6" width="74" height="245.4" fill="#0969da" rx="3"/>
<text x="523.0" y="115.6" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">9.52 ms</text>
<rect x="580.0" y="236.2" width="74" height="131.8" fill="#cf222e" rx="3"/>
<text x="617.0" y="229.2" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">398 us</text>
<text x="570.0" y="390.0" font-size="12.5" fill="#1f2328" text-anchor="middle">E = 2</text>
<text x="570.0" y="409.0" font-size="13" font-weight="700" fill="#1a7f37" text-anchor="middle">24x faster</text>
<line x1="78" y1="368" x2="734" y2="368" stroke="#1f2328" stroke-width="1.2"/>
</svg>